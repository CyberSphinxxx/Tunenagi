# Tunenagi — owned Gradle settings
#
# Division of truth (do not duplicate values across the two files):
#   * plugin + library versions -> gradle/libs.versions.toml (the version catalog)
#   * Tunenagi project constants (SDK levels, application id, version) -> here,
#     read by the module build scripts via providers.gradleProperty(...)
#
# `./gradlew printVersion` prints the catalog so the documented numbers and the
# numbers the build uses cannot drift.

org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.warning.mode=all

# ============================================================
# Android build flags (required by AGP; verified by the build)
# ============================================================
# Every dependency in this project is AndroidX (Compose, Hilt, Room, Media3,
# navigation). Without this flag AGP fails the build on purpose.
android.useAndroidX=true
# Smaller, faster R classes: each module only sees its own resources.
android.nonTransitiveRClass=true

# ============================================================
# Tunenagi project constants (audit these lines)
# ============================================================
tunenagi.target.sdk=35
tunenagi.min.sdk=26

# Packaging / signing (no secrets committed; configure in CI / local.properties only)
tunenagi.applicationId=com.tunenagi.player
tunenagi.versionCode=1
tunenagi.versionName=0.1.0-dev
