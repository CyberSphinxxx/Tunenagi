# Tunenagi Gradle wrapper properties — owned.
#
# Wrapper version is pinned to match the project's toolchain plan (AGP 8.7.3 requires
# Gradle 8.9+). If the project moves to a different Gradle release, update agp/kotlin in
# gradle/libs.versions.toml, regenerate the wrapper with `./gradlew wrapper`, and keep
# the distribution URL and the catalog in sync.

distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
